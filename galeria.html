<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Galeria | Canil LRD</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #050505;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      height: 74px;
      background: #080808;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8%;
    }

    .logo {
      font-size: 26px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .logo span {
      color: #777;
      font-weight: normal;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 15px;
      transition: 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: #fff;
    }

    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 55px 40px 80px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 45px;
    }

    .titulo h1 {
      font-family: Georgia, serif;
      font-size: 42px;
      margin-bottom: 12px;
    }

    .titulo p {
      color: #888;
      font-size: 15px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .card {
      background: #101010;
      border: 1px solid #292929;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #555;
    }

    .imagem-container {
      width: 100%;
      height: 620px;
      background: #111;
      overflow: hidden;
      cursor: pointer;
    }

    .imagem-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.03);
    }

    .info {
      padding: 25px 28px 30px;
      background: linear-gradient(to bottom, #111, #080808);
    }

    .info h2 {
      font-family: Georgia, serif;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .info p {
      color: #999;
      font-size: 15px;
    }

    footer {
      border-top: 1px solid #292929;
      text-align: center;
      padding: 40px 20px;
      background: #050505;
    }

    footer h2 {
      font-family: Georgia, serif;
      font-size: 23px;
      margin-bottom: 10px;
    }

    footer p {
      color: #666;
    }

    /* Visualização ampliada */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .modal img {
      max-width: 95%;
      max-height: 92vh;
      object-fit: contain;
      border: 1px solid #444;
    }

    .fechar {
      position: absolute;
      top: 20px;
      right: 35px;
      font-size: 42px;
      color: #fff;
      cursor: pointer;
      font-weight: 200;
    }

    @media (max-width: 1000px) {
      header {
        padding: 0 4%;
      }

      nav {
        gap: 15px;
      }

      .galeria {
        grid-template-columns: 1fr;
      }

      .imagem-container {
        height: 650px;
      }
    }

    @media (max-width: 650px) {
      header {
        height: auto;
        padding: 20px;
        flex-direction: column;
        gap: 20px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      main {
        padding: 40px 15px 60px;
      }

      .titulo h1 {
        font-size: 34px;
      }

      .imagem-container {
        height: 500px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    CANIL <span>LRD</span>
  </div>

  <nav>
    <a href="index.html">INÍCIO</a>
    <a href="canil.html">CANIL</a>
    <a href="daemon.html">DAEMON</a>
    <a href="linhagens.html">LINHAGENS</a>
    <a href="galeria.html" class="active">GALERIA</a>
    <a href="caes.html">CÃES</a>
    <a href="contato.html">CONTATO</a>
  </nav>
</header>

<main>

  <div class="titulo">
    <h1>Galeria</h1>
    <p>Daemon — Presença, estrutura e expressão</p>
  </div>

  <section class="galeria">

    <!-- FOTO 01 -->
    <article class="card">
      <div class="imagem-container"
           onclick="abrirImagem('daemon-01.png')">
        <img
          src="daemon-01.png"
          alt="Daemon sentado no jardim"
          loading="eager">
      </div>

      <div class="info">
        <h2>Daemon</h2>
        <p>Presença &amp; Estrutura</p>
      </div>
    </article>

    <!-- FOTO 02 -->
    <article class="card">
      <div class="imagem-container"
           onclick="abrirImagem('daemon-02.png')">
        <img
          src="daemon-02.png"
          alt="Daemon em destaque no parque"
          loading="eager">
      </div>

      <div class="info">
        <h2>Daemon</h2>
        <p>Expressão &amp; Temperamento</p>
      </div>
    </article>

    <!-- FOTO 03 -->
    <article class="card">
      <div class="imagem-container"
           onclick="abrirImagem('daemon-03.png')">
        <img
          src="daemon-03.png"
          alt="Daemon sentado de costas"
          loading="eager">
      </div>

      <div class="info">
        <h2>Daemon</h2>
        <p>Postura &amp; Silhueta</p>
      </div>
    </article>

  </section>

</main>

<footer>
  <h2>CANIL LRD</h2>
  <p>Excelência em Dobermanns</p>
</footer>

<!-- MODAL -->
<div class="modal" id="modal" onclick="fecharImagem()">
  <span class="fechar">&times;</span>
  <img id="imagemAmpliada" src="" alt="Imagem ampliada de Daemon">
</div>

<script>
  function abrirImagem(imagem) {
    const modal = document.getElementById("modal");
    const imagemAmpliada = document.getElementById("imagemAmpliada");

    imagemAmpliada.src = imagem;
    modal.style.display = "flex";
  }

  function fecharImagem() {
    const modal = document.getElementById("modal");
    modal.style.display = "none";
    document.getElementById("imagemAmpliada").src = "";
  }

  document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
      fecharImagem();
    }
  });
</script>

</body>
</html>
