<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Linhagens | Canil LRD</title>

    <meta
        name="description"
        content="Linhagem genealógica de Denzel B.K.V.B. — Daemon, Dobermann do Canil LRD."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                radial-gradient(circle at top, #171717 0%, #080808 45%, #030303 100%);
            color: #f1f1f1;
            font-family: Georgia, "Times New Roman", serif;
            min-height: 100vh;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            border-bottom: 1px solid #292929;
            background: rgba(5, 5, 5, 0.97);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .logo span {
            color: #c99a52;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
        }

        nav a {
            color: #bcbcbc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: #d2a45d;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1500px;
            margin: auto;
            padding: 70px 30px 100px;
        }

        .intro {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 60px;
        }

        .eyebrow {
            color: #c99a52;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(34px, 5vw, 58px);
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .intro p {
            color: #aaa;
            font-family: Arial, sans-serif;
            font-size: 15px;
        }

        /* =========================
           CÃO PRINCIPAL
        ========================= */

        .main-dog {
            max-width: 800px;
            margin: 0 auto 70px;
            border: 1px solid #3b3b3b;
            background: linear-gradient(145deg, #171717, #0d0d0d);
            padding: 35px;
            text-align: center;
            position: relative;
        }

        .main-dog::before,
        .main-dog::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 1px;
            background: #c99a52;
            top: 50%;
        }

        .main-dog::before {
            left: -50px;
        }

        .main-dog::after {
            right: -50px;
        }

        .main-dog-label {
            color: #c99a52;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 11px;
            margin-bottom: 12px;
        }

        .main-dog h2 {
            font-size: 30px;
            font-weight: normal;
            margin-bottom: 12px;
        }

        .main-dog .subtitle {
            color: #aaa;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        /* =========================
           ÁRVORE HORIZONTAL
        ========================= */

        .pedigree-wrapper {
            overflow-x: auto;
            padding: 20px 10px 40px;
        }

        .pedigree {
            min-width: 1250px;
            display: grid;
            grid-template-columns:
                1.2fr
                1.2fr
                1.2fr
                1.2fr;
            gap: 35px;
            align-items: center;
        }

        .generation {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 25px;
            min-height: 500px;
        }

        .generation-title {
            text-align: center;
            color: #c99a52;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        /* =========================
           CARDS
        ========================= */

        .dog-card {
            position: relative;
            border: 1px solid #383838;
            background: linear-gradient(145deg, #181818, #0e0e0e);
            padding: 20px 18px;
            min-height: 125px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: 0.3s ease;
        }

        .dog-card:hover {
            border-color: #c99a52;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .dog-card h3 {
            color: #ffffff;
            font-size: 17px;
            font-weight: normal;
            margin-bottom: 9px;
        }

        .dog-card p {
            color: #999;
            font-family: Arial, sans-serif;
            font-size: 11px;
            margin: 2px 0;
        }

        .dog-card .rg {
            color: #c99a52;
        }

        .dog-card .sex {
            color: #bdbdbd;
        }

        /* =========================
           CONECTORES
        ========================= */

        .connector-right::after {
            content: "";
            position: absolute;
            right: -36px;
            top: 50%;
            width: 35px;
            height: 1px;
            background: #555;
        }

        .connector-left::before {
            content: "";
            position: absolute;
            left: -36px;
            top: 50%;
            width: 35px;
            height: 1px;
            background: #555;
        }

        /* =========================
           DETALHAMENTO
        ========================= */

        .details {
            margin-top: 80px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title .eyebrow {
            margin-bottom: 8px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: normal;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .details-card {
            background: #101010;
            border: 1px solid #303030;
            padding: 28px;
        }

        .details-card h3 {
            color: #c99a52;
            font-size: 19px;
            font-weight: normal;
            margin-bottom: 20px;
            border-bottom: 1px solid #303030;
            padding-bottom: 12px;
        }

        .details-card p {
            font-family: Arial, sans-serif;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .details-card strong {
            color: #eee;
        }

        /* =========================
           OBSERVAÇÃO
        ========================= */

        .note {
            max-width: 1000px;
            margin: 45px auto 0;
            padding: 22px 25px;
            border-left: 2px solid #c99a52;
            background: #101010;
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid #282828;
            background: #050505;
            padding: 35px 20px;
            text-align: center;
            color: #777;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        footer strong {
            color: #c99a52;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 900px) {

            .header-inner {
                flex-direction: column;
                padding: 18px 15px;
            }

            nav {
                gap: 12px;
            }

            main {
                padding: 50px 15px 80px;
            }
